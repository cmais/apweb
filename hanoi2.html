<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Hanói</title>
<style>
  :root {
    --sand-a: #ECE1C8;
    --sand-b: #D8C49E;
    --wood-dark: #3B2A1E;
    --wood: #5C4030;
    --wood-light: #7C5A3E;
    --ink: #3B2E22;
    --ink-soft: #6E5C48;
    --accent: #AD8A4E;
    --seal: #A6402F;
    --card: #F7F0DE;
    --shadow: rgba(59, 42, 30, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.45), transparent 60%),
      repeating-linear-gradient(135deg, rgba(120,95,60,0.045) 0px, rgba(120,95,60,0.045) 1px, transparent 1px, transparent 5px),
      linear-gradient(180deg, var(--sand-a), var(--sand-b));
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  h1 {
    margin: 6px 0 2px;
    font-size: 2.1rem;
    letter-spacing: 3px;
    font-weight: 400;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1 svg { flex-shrink: 0; }

  .subtitle {
    color: var(--ink-soft);
    margin-bottom: 20px;
    font-size: 0.95rem;
    font-style: italic;
    text-align: center;
  }

  .painel {
    background: var(--card);
    border-radius: 10px;
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px var(--shadow), inset 0 0 0 1px rgba(173,138,78,0.25);
    margin-bottom: 26px;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  .campo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  select, button {
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
  }

  select {
    background: #fff;
    color: var(--ink);
    border: 1px solid #c9b48a;
  }

  button {
    background: linear-gradient(180deg, var(--wood-light), var(--wood));
    color: #f3e9d2;
    font-weight: 600;
    border: 1px solid var(--wood-dark);
    box-shadow: 0 3px 8px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    position: relative;
    padding-left: 26px;
  }

  button::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--seal);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  button:active { transform: translateY(0); }

  .stats {
    display: flex;
    gap: 22px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .stats b { color: var(--seal); font-family: Georgia, serif; }

  .tabuleiro {
    width: min(96vw, 900px);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, transparent 1px, transparent 5px),
      linear-gradient(180deg, var(--wood-light), var(--wood) 55%, var(--wood-dark));
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 16px 40px var(--shadow), inset 0 2px 0 rgba(255,255,255,0.12), inset 0 -2px 0 rgba(0,0,0,0.25);
    position: relative;
  }

  .torres {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    height: 320px;
    position: relative;
    background: linear-gradient(180deg, var(--sand-a), var(--sand-b));
    border-radius: 14px;
    box-shadow: inset 0 4px 14px rgba(0,0,0,0.35), inset 0 -2px 4px rgba(255,255,255,0.3);
    overflow: hidden;
  }

  .torres::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 260px;
    height: 260px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 10px solid var(--wood);
    opacity: 0.06;
    border-top-color: transparent;
    pointer-events: none;
  }

  .torre {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    position: relative;
    padding-bottom: 0;
  }

  .haste {
    position: absolute;
    bottom: 18px;
    width: 14px;
    height: 250px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.12) 0px, transparent 2px, transparent 10px),
      linear-gradient(90deg, var(--wood-dark), var(--wood-light) 45%, var(--wood-dark));
    border-radius: 7px 7px 3px 3px;
    box-shadow: 2px 0 4px rgba(0,0,0,0.2);
    z-index: 1;
  }

  .haste::after {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--wood-light), var(--wood));
    box-shadow: 0 2px 3px rgba(0,0,0,0.25);
  }

  .base {
    position: absolute;
    bottom: 0;
    left: 4%;
    right: 4%;
    height: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.1) 0px, transparent 2px, transparent 12px),
      linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    border-radius: 5px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    z-index: 1;
  }

  .discos-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    width: 100%;
    padding-bottom: 18px;
    min-height: 250px;
    justify-content: flex-start;
  }

  .torre.drag-over .haste {
    box-shadow: 0 0 16px 5px rgba(173,138,78,0.7);
  }

  .disco {
    height: 27px;
    border-radius: 14px;
    margin-bottom: 4px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.78rem;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    box-shadow: 0 3px 7px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
    user-select: none;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .disco.topo:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3), 0 0 10px rgba(173,138,78,0.4);
  }

  .disco.dragging {
    opacity: 0.6;
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    box-shadow: 0 0 18px 4px rgba(173,138,78,0.6);
    transform: scale(1.04);
  }

  .disco.topo { cursor: grab; touch-action: none; }
  .disco:not(.topo) { cursor: not-allowed; }

  .legenda-torre {
    margin-top: 12px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 16px;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  .mensagem {
    margin-top: 20px;
    min-height: 30px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--seal);
    text-align: center;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  .vitoria-overlay {
    position: fixed;
    inset: 0;
    background: rgba(59, 42, 30, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(3px);
  }

  .vitoria-overlay.ativo { display: flex; }

  .vitoria-card {
    background: var(--card);
    padding: 32px 40px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,0.4);
    border: 1px solid rgba(173,138,78,0.4);
  }

  .vitoria-card h2 {
    color: var(--seal);
    margin-top: 0;
    font-size: 1.6rem;
    font-weight: 400;
  }

  .vitoria-card p {
    margin: 6px 0;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: var(--ink-soft);
  }

  .vitoria-card button {
    margin-top: 16px;
  }

  @media (max-width: 600px) {
    .torres { height: 220px; }
    .haste { height: 175px; }
    .disco { height: 21px; font-size: 0.68rem; }
  }
</style>
</head>
<body>

  <h1>
    <svg width="34" height="34" viewBox="0 0 100 100">
      <path d="M 50 12 A 38 38 0 1 1 15 50" fill="none" stroke="#A6402F" stroke-width="7" stroke-linecap="round"/>
    </svg>
    Torre de Hanói
  </h1>
  <div class="subtitle">Arraste os discos entre as torres. Mova toda a pilha para a torre da direita.</div>

  <div class="painel">
    <div class="campo">
      <label for="qtdDiscos">Discos:</label>
      <select id="qtdDiscos">
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <button id="btnNovoJogo">Novo Jogo</button>
    <button id="btnReiniciar">Reiniciar</button>
    <div class="stats">
      <div>Movimentos: <b id="contMovimentos">0</b></div>
      <div>Mínimo possível: <b id="minMovimentos">0</b></div>
    </div>
  </div>

  <div class="tabuleiro">
    <div class="torres" id="torres">
      <div class="torre" data-index="0">
        <div class="haste"></div>
        <div class="base"></div>
        <div class="discos-container" id="discos-0"></div>
      </div>
      <div class="torre" data-index="1">
        <div class="haste"></div>
        <div class="base"></div>
        <div class="discos-container" id="discos-1"></div>
      </div>
      <div class="torre" data-index="2">
        <div class="haste"></div>
        <div class="base"></div>
        <div class="discos-container" id="discos-2"></div>
      </div>
    </div>
  </div>
  <div class="legenda-torre" style="width: min(96vw, 900px);">
    <div style="display:flex; justify-content:space-around;">
      <span>Origem</span><span>Auxiliar</span><span>Destino</span>
    </div>
  </div>

  <div class="mensagem" id="mensagem"></div>

  <div class="vitoria-overlay" id="vitoriaOverlay">
    <div class="vitoria-card">
      <h2>🎉 Parabéns!</h2>
      <p>Você resolveu a Torre de Hanói com <b id="vitoriaMovimentos"></b> movimentos.</p>
      <p>O mínimo possível era <b id="vitoriaMinimo"></b> movimentos.</p>
      <button id="btnFecharVitoria">Jogar Novamente</button>
    </div>
  </div>

<script>
(function () {
  const PEDRAS = [
    { nome: 'Quartzo Rosa', topo: '#F3C6D9', base: '#C97A9B', texto: '#5A2438' },
    { nome: 'Jade',         topo: '#6FBE9C', base: '#2F6B52', texto: '#FFFFFF' },
    { nome: 'Lápis-lazúli', topo: '#3E6FA6', base: '#1B3A5C', texto: '#F4D98B' },
    { nome: 'Âmbar',        topo: '#F0A93E', base: '#B06A12', texto: '#4A2A00' },
    { nome: 'Ametista',     topo: '#A87BD1', base: '#5F3D8A', texto: '#FFFFFF' },
    { nome: 'Turquesa',     topo: '#6BD9CB', base: '#257A70', texto: '#113330' },
    { nome: 'Ônix',         topo: '#3D3D42', base: '#121214', texto: '#E8C97A' },
    { nome: 'Granada',      topo: '#C1465A', base: '#6E1622', texto: '#FFFFFF' }
  ];

  let torres = [[], [], []];
  let numDiscos = 5;
  let movimentos = 0;
  let discoArrastado = null;
  let origemArrasto = null;
  let jogoFinalizado = false;

  const elTorres = [
    document.getElementById('discos-0'),
    document.getElementById('discos-1'),
    document.getElementById('discos-2')
  ];
  const elTorreWrap = document.querySelectorAll('.torre');
  const elContMovimentos = document.getElementById('contMovimentos');
  const elMinMovimentos = document.getElementById('minMovimentos');
  const elMensagem = document.getElementById('mensagem');
  const elQtdDiscos = document.getElementById('qtdDiscos');
  const elVitoriaOverlay = document.getElementById('vitoriaOverlay');
  const elVitoriaMovimentos = document.getElementById('vitoriaMovimentos');
  const elVitoriaMinimo = document.getElementById('vitoriaMinimo');

  function iniciarJogo() {
    numDiscos = parseInt(elQtdDiscos.value, 10);
    torres = [[], [], []];
    for (let i = numDiscos; i >= 1; i--) {
      torres[0].push(i);
    }
    movimentos = 0;
    jogoFinalizado = false;
    elMensagem.textContent = '';
    elVitoriaOverlay.classList.remove('ativo');
    elMinMovimentos.textContent = (Math.pow(2, numDiscos) - 1).toString();
    atualizarContadores();
    renderizar();
  }

  function atualizarContadores() {
    elContMovimentos.textContent = movimentos.toString();
  }

  function larguraDisco(tamanho) {
    const minPct = 32;
    const maxPct = 92;
    const passo = (maxPct - minPct) / Math.max(1, (7));
    return minPct + (tamanho - 1) * passo;
  }

  function renderizar() {
    for (let t = 0; t < 3; t++) {
      const container = elTorres[t];
      container.innerHTML = '';
      const pilha = torres[t];
      pilha.forEach((tamanho, idx) => {
        const disco = document.createElement('div');
        disco.className = 'disco';
        disco.dataset.tamanho = tamanho;
        disco.dataset.torre = t;
        const ehTopo = idx === pilha.length - 1;
        if (ehTopo) disco.classList.add('topo');
        const pedra = PEDRAS[tamanho - 1];
        disco.style.width = larguraDisco(tamanho) + '%';
        disco.style.background =
          `radial-gradient(circle at 28% 22%, rgba(255,255,255,0.65), transparent 45%), ` +
          `linear-gradient(180deg, ${pedra.topo}, ${pedra.base})`;
        disco.style.color = pedra.texto;
        disco.title = pedra.nome;
        disco.textContent = tamanho;
        disco.draggable = ehTopo && !jogoFinalizado;

        disco.addEventListener('dragstart', (e) => {
          if (!ehTopo || jogoFinalizado) { e.preventDefault(); return; }
          discoArrastado = tamanho;
          origemArrasto = t;
          disco.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        disco.addEventListener('dragend', () => {
          disco.classList.remove('dragging');
        });

        disco.addEventListener('touchstart', (e) => {
          if (!ehTopo || jogoFinalizado) return;
          iniciarToque(e, disco, tamanho, t);
        }, { passive: false });

        container.appendChild(disco);
      });
    }
  }

  let ghostEl = null;
  let torreDestaqueAtual = null;

  function iniciarToque(e, disco, tamanho, torreOrigem) {
    e.preventDefault();
    const toque = e.touches[0];
    discoArrastado = tamanho;
    origemArrasto = torreOrigem;
    disco.classList.add('dragging');

    const rect = disco.getBoundingClientRect();
    ghostEl = disco.cloneNode(true);
    ghostEl.classList.add('disco-fantasma');
    ghostEl.style.position = 'fixed';
    ghostEl.style.width = rect.width + 'px';
    ghostEl.style.height = rect.height + 'px';
    ghostEl.style.left = rect.left + 'px';
    ghostEl.style.top = rect.top + 'px';
    ghostEl.style.margin = '0';
    ghostEl.style.pointerEvents = 'none';
    ghostEl.style.zIndex = '999';
    ghostEl.style.opacity = '0.9';
    ghostEl.style.transform = 'scale(1.06)';
    ghostEl.style.boxShadow = '0 8px 20px rgba(0,0,0,0.5), 0 0 16px 4px rgba(255,184,77,0.6)';
    document.body.appendChild(ghostEl);

    ghostEl._offsetX = toque.clientX - rect.left;
    ghostEl._offsetY = toque.clientY - rect.top;

    const mover = (ev) => moverToque(ev);
    const finalizar = (ev) => finalizarToque(ev, mover, finalizar);

    document.addEventListener('touchmove', mover, { passive: false });
    document.addEventListener('touchend', finalizar, { passive: false });
    document.addEventListener('touchcancel', finalizar, { passive: false });
  }

  function moverToque(e) {
    if (!ghostEl) return;
    e.preventDefault();
    const toque = e.touches[0];
    ghostEl.style.left = (toque.clientX - ghostEl._offsetX) + 'px';
    ghostEl.style.top = (toque.clientY - ghostEl._offsetY) + 'px';

    ghostEl.style.display = 'none';
    const elAlvo = document.elementFromPoint(toque.clientX, toque.clientY);
    ghostEl.style.display = '';

    const torreAlvo = elAlvo ? elAlvo.closest('.torre') : null;

    if (torreDestaqueAtual && torreDestaqueAtual !== torreAlvo) {
      torreDestaqueAtual.classList.remove('drag-over');
      torreDestaqueAtual = null;
    }
    if (torreAlvo) {
      torreAlvo.classList.add('drag-over');
      torreDestaqueAtual = torreAlvo;
    }
  }

  function finalizarToque(e, mover, finalizar) {
    e.preventDefault();
    document.removeEventListener('touchmove', mover);
    document.removeEventListener('touchend', finalizar);
    document.removeEventListener('touchcancel', finalizar);

    const toque = (e.changedTouches && e.changedTouches[0]) || null;

    if (ghostEl) {
      ghostEl.remove();
      ghostEl = null;
    }
    if (torreDestaqueAtual) {
      torreDestaqueAtual.classList.remove('drag-over');
      torreDestaqueAtual = null;
    }

    if (toque && discoArrastado !== null && origemArrasto !== null && !jogoFinalizado) {
      const elAlvo = document.elementFromPoint(toque.clientX, toque.clientY);
      const torreAlvo = elAlvo ? elAlvo.closest('.torre') : null;
      if (torreAlvo) {
        const indexDestino = parseInt(torreAlvo.dataset.index, 10);
        tentarMover(origemArrasto, indexDestino);
      }
    }

    discoArrastado = null;
    origemArrasto = null;
    renderizar();
  }

  elTorreWrap.forEach((torreEl) => {
    const indexDestino = parseInt(torreEl.dataset.index, 10);

    torreEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      torreEl.classList.add('drag-over');
    });

    torreEl.addEventListener('dragleave', () => {
      torreEl.classList.remove('drag-over');
    });

    torreEl.addEventListener('drop', (e) => {
      e.preventDefault();
      torreEl.classList.remove('drag-over');
      if (discoArrastado === null || origemArrasto === null || jogoFinalizado) return;
      tentarMover(origemArrasto, indexDestino);
      discoArrastado = null;
      origemArrasto = null;
    });
  });

  function tentarMover(origem, destino) {
    if (origem === destino) return;
    const pilhaOrigem = torres[origem];
    const pilhaDestino = torres[destino];
    if (pilhaOrigem.length === 0) return;

    const disco = pilhaOrigem[pilhaOrigem.length - 1];
    const topoDestino = pilhaDestino[pilhaDestino.length - 1];

    if (topoDestino !== undefined && disco > topoDestino) {
      mostrarMensagem('Movimento inválido: um disco maior não pode ficar sobre um menor!', true);
      return;
    }

    pilhaOrigem.pop();
    pilhaDestino.push(disco);
    movimentos++;
    atualizarContadores();
    renderizar();
    mostrarMensagem('');

    if (torres[2].length === numDiscos) {
      finalizarJogo();
    }
  }

  function mostrarMensagem(texto, erro) {
    elMensagem.textContent = texto;
    elMensagem.style.color = erro ? '#ff6b6b' : 'var(--accent)';
    if (texto) {
      clearTimeout(mostrarMensagem._t);
      mostrarMensagem._t = setTimeout(() => { elMensagem.textContent = ''; }, 2200);
    }
  }

  function finalizarJogo() {
    jogoFinalizado = true;
    renderizar();
    elVitoriaMovimentos.textContent = movimentos.toString();
    elVitoriaMinimo.textContent = (Math.pow(2, numDiscos) - 1).toString();
    setTimeout(() => elVitoriaOverlay.classList.add('ativo'), 400);
  }

  document.getElementById('btnNovoJogo').addEventListener('click', iniciarJogo);
  document.getElementById('btnReiniciar').addEventListener('click', iniciarJogo);
  document.getElementById('btnFecharVitoria').addEventListener('click', iniciarJogo);
  elQtdDiscos.addEventListener('change', iniciarJogo);

  iniciarJogo();
})();
</script>
</body>
</html>
