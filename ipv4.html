<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPv4, IPv6 e Operadora</title>
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --muted: #999;
            --border: #fff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 90vw;
        }
        dl.info-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .info-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: clamp(1.1rem, 4vw, 2rem);
            transition: opacity 0.2s ease;
        }
        .info-row.loading {
            opacity: 0.5;
        }
        dt.label {
            font-weight: 700;
        }
        dd.value {
            font-weight: 400;
            word-break: break-all;
        }
        .copy-btn {
            background: none;
            border: 1px solid var(--muted);
            color: var(--fg);
            font-size: 0.85rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
        }
        .copy-btn:hover {
            background: var(--fg);
            color: var(--bg);
        }
        .copy-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .copy-btn.copied {
            border-color: #4caf50;
        }
        button#refresh-btn {
            background: var(--bg);
            color: var(--fg);
            border: 2px solid var(--border);
            padding: 0.8rem 2rem;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s, color 0.3s;
            margin-top: 0.5rem;
        }
        button#refresh-btn:hover:not(:disabled) {
            background: var(--fg);
            color: var(--bg);
        }
        button#refresh-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .privacy-note {
            font-size: 0.75rem;
            color: var(--muted);
            max-width: 40ch;
            margin: 0 auto;
        }
        @media (max-width: 480px) {
            .info-row {
                flex-direction: column;
                gap: 0.15rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <dl class="info-list">
            <div class="info-row" id="row-ipv4">
                <dt class="label">IPv4:</dt>
                <dd class="value" id="ipv4-value" aria-live="polite">Carregando...</dd>
                <button class="copy-btn" data-target="ipv4-value" aria-label="Copiar IPv4" disabled>copiar</button>
            </div>
            <div class="info-row" id="row-ipv6">
                <dt class="label">IPv6:</dt>
                <dd class="value" id="ipv6-value" aria-live="polite">Carregando...</dd>
                <button class="copy-btn" data-target="ipv6-value" aria-label="Copiar IPv6" disabled>copiar</button>
            </div>
            <div class="info-row" id="row-operadora">
                <dt class="label">Operadora:</dt>
                <dd class="value" id="operadora-value" aria-live="polite">Carregando...</dd>
                <button class="copy-btn" data-target="operadora-value" aria-label="Copiar operadora" disabled>copiar</button>
            </div>
        </dl>

        <button id="refresh-btn" aria-label="Atualizar informações de IP e operadora">Atualizar</button>

        <p class="privacy-note">
            Os dados são consultados em tempo real nos serviços ipify, ipwho.is e ipapi.co, que recebem seu IP público para responder a esta página.
        </p>
    </div>

    <script>
        const refreshBtn = document.getElementById('refresh-btn');
        const REFRESH_COOLDOWN_MS = 3000;
        let lastRefreshAt = 0;

        const fields = {
            ipv4: { valueEl: document.getElementById('ipv4-value'), rowEl: document.getElementById('row-ipv4') },
            ipv6: { valueEl: document.getElementById('ipv6-value'), rowEl: document.getElementById('row-ipv6') },
            operadora: { valueEl: document.getElementById('operadora-value'), rowEl: document.getElementById('row-operadora') }
        };

        // Busca com timeout (evita espera indefinida); expõe se foi abort (timeout) ou outro erro
        async function fetchWithTimeout(url, timeout = 5000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal });
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                return await response.json();
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function getIPv4() {
            try {
                const data = await fetchWithTimeout('https://api.ipify.org?format=json');
                return data.ip;
            } catch (e) {
                console.error('Falha ao obter IPv4:', e);
                return 'Indisponível';
            }
        }

        async function getIPv6() {
            try {
                const data = await fetchWithTimeout('https://api6.ipify.org?format=json', 5000);
                return data.ip;
            } catch (e) {
                if (e.name === 'AbortError') {
                    console.warn('IPv6 sem resposta dentro do timeout (provável falta de suporte na rede):', e);
                    return 'Sem suporte a IPv6 nesta rede';
                }
                console.error('Falha ao obter IPv6:', e);
                return 'Indisponível';
            }
        }

        async function getOperadora() {
            try {
                const data = await fetchWithTimeout('https://ipwho.is/');
                if (data.success && data.connection && data.connection.org) {
                    return data.connection.org;
                }
            } catch (e) {
                console.warn('ipwho.is falhou, tentando fallback ipapi.co:', e);
            }
            try {
                const data = await fetchWithTimeout('https://ipapi.co/json/');
                if (data && data.org) {
                    return data.org;
                }
            } catch (e) {
                console.error('Falha ao obter operadora (ipapi.co também falhou):', e);
            }
            return 'Indisponível';
        }

        const fetchers = { ipv4: getIPv4, ipv6: getIPv6, operadora: getOperadora };

        // Helper genérico: marca a linha como carregando, busca o valor e atualiza a UI
        async function loadField(key) {
            const { valueEl, rowEl } = fields[key];
            rowEl.classList.add('loading');
            valueEl.textContent = 'Carregando...';
            setCopyEnabled(key, false);

            const value = await fetchers[key]();

            valueEl.textContent = value;
            rowEl.classList.remove('loading');
            setCopyEnabled(key, value !== 'Indisponível' && value !== 'Sem suporte a IPv6 nesta rede');
        }

        function setCopyEnabled(key, enabled) {
            const btn = document.querySelector(`.copy-btn[data-target="${key}-value"]`);
            if (btn) btn.disabled = !enabled;
        }

        async function loadData() {
            await Promise.all(Object.keys(fields).map(loadField));
        }

        function updateRefreshButtonState() {
            const elapsed = Date.now() - lastRefreshAt;
            const remaining = REFRESH_COOLDOWN_MS - elapsed;
            if (remaining > 0) {
                refreshBtn.disabled = true;
                setTimeout(updateRefreshButtonState, remaining);
            } else {
                refreshBtn.disabled = false;
            }
        }

        async function handleRefresh() {
            lastRefreshAt = Date.now();
            updateRefreshButtonState();
            await loadData();
        }

        // Copiar valor ao clicar no botão correspondente
        document.querySelectorAll('.copy-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const targetId = btn.getAttribute('data-target');
                const text = document.getElementById(targetId).textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    btn.textContent = 'copiado!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = 'copiar';
                        btn.classList.remove('copied');
                    }, 1500);
                } catch (e) {
                    console.error('Falha ao copiar para a área de transferência:', e);
                }
            });
        });

        refreshBtn.addEventListener('click', handleRefresh);

        // Carrega ao abrir a página
        handleRefresh();
    </script>
</body>
</html>
