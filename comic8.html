<style>
:root {

<body>

<div id="history-bar">

</div>

<div id="error-message"></div>
<div id="keyboard-hint">
    <strong>Atalhos:</strong><br>
    ← →: Navegar<br>

    + -: Zoom<br>

    Esc: Sair / Fechar
</div>
<div id="loading-indicator">Carregando página...</div>

<script>
// ---------------------------------------------------------------------------
// Classe base (interface) para leitores
// ---------------------------------------------------------------------------
class ComicBookReader {
  static async loadFile(file) {
    if (file.name.toLowerCase().endsWith('.cbz')) return new CBZReader(file);
    if (file.name.toLowerCase().endsWith('.pdf')) return new PDFReader(file);
    throw new Error("Formato não suportado");
  }
  async load()          { throw new Error("Método não implementado"); }
  get pageCount()       { throw new Error("Método não implementado"); }
  async getPage(index)  { throw new Error("Método não implementado"); }
  close()               { throw new Error("Método não implementado"); }
}

// ---------------------------------------------------------------------------
// Leitor CBZ
// ---------------------------------------------------------------------------
class CBZReader extends ComicBookReader {
  constructor(file) {
    super();
    this.file = file;
    this.zip = null;
    this.imageFiles = [];
  }

  async load() {
    const buffer = await this.file.arrayBuffer();
    this.zip = await JSZip.loadAsync(buffer);
    this.imageFiles = Object.keys(this.zip.files)
      .filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f))
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (this.imageFiles.length === 0)
      throw new Error("Nenhuma imagem encontrada no arquivo CBZ");
    return this;
  }

  get pageCount() { return this.imageFiles.length; }

  async getPage(index) {
    return this.zip.file(this.imageFiles[index]).async("blob");
  }

  close() { this.zip = null; this.imageFiles = []; }
}

// ---------------------------------------------------------------------------
// Leitor PDF (cache LRU de 10 páginas; escala baseada em devicePixelRatio)
// ---------------------------------------------------------------------------
class PDFReader extends ComicBookReader {
  constructor(file) {
    super();
    this.file = file;
    this.pdfDoc = null;
    this.canvasCache = new Map();
    this.CACHE_LIMIT = 10;
  }

  async load() {
    const typedarray = new Uint8Array(await this.file.arrayBuffer());
    this.pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
    return this;
  }

  get pageCount() { return this.pdfDoc.numPages; }

  async getPage(index) {
    if (this.canvasCache.has(index)) {
      const cached = this.canvasCache.get(index);
      this.canvasCache.delete(index);
      this.canvasCache.set(index, cached);
      return new Promise(resolve => cached.toBlob(resolve, 'image/png'));
    }

    const page = await this.pdfDoc.getPage(index + 1);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const scale = dpr * 1.5;
    const viewport = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    canvas.height = viewport.height;
    canvas.width  = viewport.width;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

    if (this.canvasCache.size >= this.CACHE_LIMIT) {
      const oldestKey = this.canvasCache.keys().next().value;
      this.canvasCache.delete(oldestKey);
    }
    this.canvasCache.set(index, canvas);

    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  close() {
    if (this.pdfDoc) { this.pdfDoc.destroy(); this.pdfDoc = null; }
    this.canvasCache.clear();
  }
}

// ---------------------------------------------------------------------------
// Estado global
// ---------------------------------------------------------------------------
let currentReader    = null;
let currentObjectURL = null;
let currentFileName  = "";
let currentIndex     = 0;

// Handle persistente (File System Access API) do arquivo aberto, usado para
// reabrir em 1 clique a partir do histórico. Pode ser null (Firefox, input
// file comum, drag&drop sem suporte à API).
let currentFileHandle = null;
const supportsFileHandle = typeof window.showOpenFilePicker === "function";

// Thumbnail da capa (página 0), gerada uma única vez em loadFile().
let currentCoverThumbnail = null;

// Token de render para cancelar chamadas concorrentes
let renderToken = 0;

// Visualização: 0 = simples (padrão), 1 = dupla par-ímpar (ex.: 2-3),
// 2 = dupla ímpar-par (ex.: 3-4). Em dupla, currentIndex = página da esquerda.
let viewMode = 0;
let spreadAnchor = 0; // página simples de onde o ciclo da dupla começou

/* Zoom */
let zoomLevel      = 1.0;
const ZOOM_STEP    = 0.1;
const BASE_SIZE    = 100;

/* Referências DOM */
const container       = document.getElementById("viewer-container");
const img             = document.getElementById("comic-img");
const dropZone        = document.getElementById("drop-zone");
const fileInput       = document.getElementById("file-input");
const errorMessage    = document.getElementById("error-message");
const keyboardHint    = document.getElementById("keyboard-hint");
const loadingIndicator = document.getElementById("loading-indicator");
const pageInfoEl      = document.getElementById("page-info");
const gotoOverlay     = document.getElementById("goto-overlay");
const gotoInput       = document.getElementById("goto-input");
const historyBar      = document.getElementById("history-bar");
const historyItemsEl  = document.getElementById("history-items");

// ---------------------------------------------------------------------------
// Drag / Panning (mouse e touch)
// ---------------------------------------------------------------------------
let isDragging = false, startX, startY, scrollLeft, scrollTop;

container.addEventListener("mousedown", e => {
    isDragging = true;
    startX = e.pageX; startY = e.pageY;
    scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
});
window.addEventListener("mouseup", () => { isDragging = false; });
container.addEventListener("mousemove", e => {
    if (!isDragging) return;
    container.scrollLeft = scrollLeft - (e.pageX - startX);
    container.scrollTop  = scrollTop  - (e.pageY - startY);
});

let touchStartX, touchStartY, touchScrollLeft, touchScrollTop;
container.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].pageX;
    touchStartY = e.touches[0].pageY;
    touchScrollLeft = container.scrollLeft;
    touchScrollTop  = container.scrollTop;
}, { passive: true });
container.addEventListener("touchmove", e => {
    if (e.touches.length !== 1) return;
    container.scrollLeft = touchScrollLeft - (e.touches[0].pageX - touchStartX);
    container.scrollTop  = touchScrollTop  - (e.touches[0].pageY - touchStartY);
}, { passive: true });

// Zoom com Ctrl + scroll do mouse
container.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (e.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

// ---------------------------------------------------------------------------
// Upload / Drop
// ---------------------------------------------------------------------------
// Chrome/Edge: showOpenFilePicker() dá um handle persistente (reabertura em
// 1 clique via histórico). Outros navegadores: <input type="file"> normal.
async function handleDropZoneClick() {
    if (!supportsFileHandle) {
        fileInput.click();
        return;
    }
    try {
        const [handle] = await window.showOpenFilePicker({
            types: [{
                description: "Quadrinhos (CBZ/PDF)",
                accept: { "application/zip": [".cbz"], "application/pdf": [".pdf"] }
            }],
            excludeAcceptAllOption: false,
            multiple: false
        });
        const file = await handle.getFile();
        currentFileHandle = handle;
        await loadFile(file);
    } catch (err) {
        if (err.name !== "AbortError") console.error("Erro ao abrir arquivo:", err);
    }
}

dropZone.onclick = handleDropZoneClick;
fileInput.onchange = e => {
    if (e.target.files.length > 0) {
        currentFileHandle = null;
        loadFile(e.target.files[0]);
    }
};

// Contador de profundidade evita "piscar" ao mover sobre filhos
let dragDepth = 0;
document.addEventListener('dragover', e => e.preventDefault());
dropZone.addEventListener('dragenter', () => { dragDepth++; dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dropZone.classList.remove('drag-over'); } });
document.addEventListener('drop', async e => {
    e.preventDefault();
    dragDepth = 0;
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length === 0) return;

    // Tenta obter um handle persistente também no drag&drop (Chrome/Edge).
    let handle = null;
    try {
        const item = e.dataTransfer.items && e.dataTransfer.items[0];
        if (item && typeof item.getAsFileSystemHandle === "function") {
            handle = await item.getAsFileSystemHandle();
        }
    } catch { /* ignorado, segue sem handle */ }

    currentFileHandle = handle;
    loadFile(e.dataTransfer.files[0]);
});

// ---------------------------------------------------------------------------
// Utilitários de UI
// ---------------------------------------------------------------------------
function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
    setTimeout(() => { errorMessage.style.display = "none"; }, 5000);
}

function showLoading(show) {
    loadingIndicator.style.display = show ? "block" : "none";
}

function showKeyboardHint() {
    keyboardHint.style.display = "block";
    setTimeout(() => { keyboardHint.style.display = "none"; }, 3000);
}

function updateTabTitle(filename) {
    if (filename) {
        let name = filename.replace(/\.(cbz|pdf|zip)$/i, '').replace(/_/g, ' ');
        document.title = `${name} - Comic Web Reader`;
    } else {
        document.title = 'Comic Web Reader - v5.1';
    }
}

// Wrapper seguro para localStorage
const Storage = {
    get(key) {
        try { return localStorage.getItem(key); } catch { return null; }
    },
    set(key, value) {
        try { localStorage.setItem(key, value); } catch { /* ignorado */ }
    }
};

// ---------------------------------------------------------------------------
// Histórico de leitura (IndexedDB)
// Guarda até N entradas: nome do arquivo, handle persistente (quando
// disponível), progresso, contagem de páginas, thumbnail e timestamp.
// Independente do wrapper "Storage" (localStorage) usado para o progresso.
// ---------------------------------------------------------------------------
const HISTORY_DB_NAME    = "ComicReaderHistoryDB";
const HISTORY_DB_VERSION = 1;
const HISTORY_STORE      = "historico";
const HISTORY_MAX_ITEMS  = 10;

let historyDbPromise = null;

function openHistoryDB() {
    if (historyDbPromise) return historyDbPromise;
    historyDbPromise = new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) { reject(new Error("IndexedDB indisponível")); return; }
        const req = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(HISTORY_STORE)) {
                db.createObjectStore(HISTORY_STORE, { keyPath: "fileName" });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
    });
    return historyDbPromise;
}

async function historyGetAll() {
    try {
        const db = await openHistoryDB();
        return await new Promise((resolve, reject) => {
            const tx  = db.transaction(HISTORY_STORE, "readonly");
            const req = tx.objectStore(HISTORY_STORE).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror   = () => reject(req.error);
        });
    } catch {
        return [];
    }
}

async function historyPut(entry) {
    try {
        const db = await openHistoryDB();
        await new Promise((resolve, reject) => {
            const tx = db.transaction(HISTORY_STORE, "readwrite");
            tx.objectStore(HISTORY_STORE).put(entry);
            tx.oncomplete = () => resolve();
            tx.onerror    = () => reject(tx.error);
        });
    } catch { /* best-effort: falha aqui não afeta a leitura */ }
}

async function historyDelete(fileName) {
    try {
        const db = await openHistoryDB();
        await new Promise((resolve, reject) => {
            const tx = db.transaction(HISTORY_STORE, "readwrite");
            tx.objectStore(HISTORY_STORE).delete(fileName);
            tx.oncomplete = () => resolve();
            tx.onerror    = () => reject(tx.error);
        });
    } catch { /* best-effort */ }
}

// Mantém no máximo HISTORY_MAX_ITEMS entradas, apagando as mais antigas.
async function pruneHistory() {
    const items = (await historyGetAll()).sort((a, b) => b.timestamp - a.timestamp);
    if (items.length <= HISTORY_MAX_ITEMS) return;
    const excedentes = items.slice(HISTORY_MAX_ITEMS);
    for (const entry of excedentes) {
        await historyDelete(entry.fileName);
    }
}

// Miniatura da CAPA (página 0), gerada uma vez por arquivo aberto.
// Retorna null em caso de falha, para nunca interromper a leitura.
async function generateCoverThumbnail(reader) {
    try {
        const blob = await reader.getPage(0);
        const url = URL.createObjectURL(blob);
        try {
            const coverImg = await new Promise((resolve, reject) => {
                const temp = new Image();
                temp.onload  = () => resolve(temp);
                temp.onerror = () => reject(new Error("Falha ao decodificar a capa"));
                temp.src = url;
            });

            // Quadro 100x156 (~1,56:1), encaixe "contain" sem cortar a capa
            const w = 100, h = 156;
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, w, h);

            const iw = coverImg.naturalWidth, ih = coverImg.naturalHeight;
            const scale = Math.min(w / iw, h / ih);
            const dw = iw * scale, dh = ih * scale;
            const dx = (w - dw) / 2, dy = (h - dh) / 2;

            ctx.drawImage(coverImg, 0, 0, iw, ih, dx, dy, dw, dh);
            return canvas.toDataURL("image/jpeg", 0.6);
        } finally {
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        console.error("Falha ao gerar thumbnail da capa:", err);
        return null;
    }
}

// Atualiza (ou cria) a entrada de histórico da HQ atual (fire-and-forget).
async function updateHistoryEntry() {
    if (!currentReader || !currentFileName) return;
    const entry = {
        fileName: currentFileName,
        currentIndex: currentIndex,
        pageCount: currentReader.pageCount,
        timestamp: Date.now()
    };
    if (currentCoverThumbnail) entry.thumbnail = currentCoverThumbnail;
    if (currentFileHandle) entry.fileHandle = currentFileHandle;
    await historyPut(entry);
}

// Barra de histórico com as últimas HQs lidas; some quando não há itens.
async function renderHistoryBar() {
    const items = (await historyGetAll())
        .sort((a, b) => b.timestamp - a.timestamp)
        .slice(0, HISTORY_MAX_ITEMS);

    historyItemsEl.innerHTML = "";

    if (items.length === 0) {
        historyBar.classList.remove("visible");
        return;
    }
    historyBar.classList.add("visible");

    for (const entry of items) {
        const item = document.createElement("div");
        item.className = "history-item";
        item.title = entry.fileName;

        const thumb = document.createElement("img");
        thumb.className = "history-thumb";
        thumb.alt = entry.fileName;
        if (entry.thumbnail) thumb.src = entry.thumbnail;

        const progress = document.createElement("div");
        progress.className = "history-progress";
        const fill = document.createElement("div");
        fill.className = "history-progress-fill";
        const pct = entry.pageCount
            ? Math.round(((entry.currentIndex + 1) / entry.pageCount) * 100)
            : 0;
        fill.style.width = pct + "%";
        progress.appendChild(fill);

        const name = document.createElement("div");
        name.className = "history-name";
        name.textContent = entry.fileName.replace(/\.(cbz|pdf)$/i, "");

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "history-delete-btn";
        deleteBtn.type = "button";
        deleteBtn.textContent = "✕";
        deleteBtn.title = "Remover do histórico";
        deleteBtn.setAttribute("aria-label", "Remover " + entry.fileName + " do histórico");
        deleteBtn.addEventListener("click", async (ev) => {
            ev.stopPropagation(); // não deve disparar resumeFromHistory no item pai
            await historyDelete(entry.fileName);
            renderHistoryBar();
        });

        item.appendChild(thumb);
        item.appendChild(progress);
        item.appendChild(name);
        item.appendChild(deleteBtn);

        item.addEventListener("click", () => resumeFromHistory(entry));
        historyItemsEl.appendChild(item);
    }
}

// Reabre a HQ a partir de um handle persistente (Chrome/Edge). Sem handle
// válido, cai no seletor de arquivo; o progresso salvo (Storage) retoma
// a leitura sozinho ao reabrir o mesmo arquivo por nome.
async function resumeFromHistory(entry) {
    if (entry.fileHandle) {
        try {
            let perm = await entry.fileHandle.queryPermission({ mode: "read" });
            if (perm !== "granted") {
                perm = await entry.fileHandle.requestPermission({ mode: "read" });
            }
            if (perm === "granted") {
                const file = await entry.fileHandle.getFile();
                currentFileHandle = entry.fileHandle;
                await loadFile(file);
                return;
            }
        } catch (err) {
            console.error("Falha ao reabrir handle do histórico:", err);
        }
    }
    showError(`Selecione o arquivo "${entry.fileName}" para retomar a leitura.`);
    handleDropZoneClick();
}

// ---------------------------------------------------------------------------
// Carregamento do arquivo
// ---------------------------------------------------------------------------
async function loadFile(file) {
    try {
        if (currentReader) { currentReader.close(); currentReader = null; }

        if (!file.name.toLowerCase().match(/\.(cbz|pdf)$/)) {
            showError("Por favor, selecione um arquivo .cbz ou .pdf válido");
            return;
        }

        showLoading(true);
        currentFileName = file.name;

        currentReader = await ComicBookReader.loadFile(file);
        await currentReader.load();

        // Capa capturada uma única vez, independe da página inicial (resume)
        currentCoverThumbnail = await generateCoverThumbnail(currentReader);

        const saved = parseInt(Storage.get("prog_" + file.name)) || 0;
        currentIndex = Math.max(0, Math.min(saved, currentReader.pageCount - 1));

        // Registra o histórico já na abertura e poda o excedente
        await updateHistoryEntry();
        await pruneHistory();

        zoomLevel = 1.0;
        viewMode = 0;

        dropZone.style.display = "none";
        container.style.display = "block";
        historyBar.classList.remove("visible");

        await renderPage();
        updateTabTitle(file.name);
        showKeyboardHint();

    } catch (error) {
        console.error("Erro ao carregar arquivo:", error);
        showError(error.message || "Erro ao carregar arquivo. Verifique se é um CBZ ou PDF válido.");
    } finally {
        showLoading(false);
    }
}

// ---------------------------------------------------------------------------
// Renderização de página (token evita renders concorrentes)
// ---------------------------------------------------------------------------
async function renderPage() {
    const myToken = ++renderToken;

    img.style.opacity = 0;
    showLoading(true);

    await new Promise(r => setTimeout(r, 50));

    if (myToken !== renderToken) return;

    try {
        if (currentObjectURL) {
            URL.revokeObjectURL(currentObjectURL);
            currentObjectURL = null;
        }

        const blob = viewMode === 0
            ? await currentReader.getPage(currentIndex)
            : await buildSpreadBlob(currentIndex);

        if (myToken !== renderToken) return;

        currentObjectURL = URL.createObjectURL(blob);

        await new Promise((resolve, reject) => {
            img.onload = () => { img.onload = null; img.onerror = null; resolve(); };
            img.onerror = () => { img.onload = null; img.onerror = null; reject(new Error(`Erro ao carregar página ${currentIndex + 1}`)); };
            img.src = currentObjectURL;
        });

        if (myToken !== renderToken) return;

        img.style.opacity = 1;
        container.scrollTop  = 0;
        container.scrollLeft = 0;

        pageInfoEl.textContent = viewMode === 0
            ? `${currentIndex + 1} / ${currentReader.pageCount}`
            : `${currentIndex + 1}-${currentIndex + 2} / ${currentReader.pageCount}`;
        Storage.set("prog_" + currentFileName, currentIndex);

        updateHistoryEntry();

        applyZoom();

        prefetchPage(currentIndex + (viewMode === 0 ? 1 : 2));

    } catch (error) {
        if (myToken !== renderToken) return;
        console.error("Erro ao renderizar página:", error);
        showError(error.message || "Erro ao carregar página. Tente novamente.");
        img.style.opacity = 1;
    } finally {
        if (myToken === renderToken) showLoading(false);
    }
}

// Pré-carregamento silencioso da próxima página
function prefetchPage(index) {
    if (!currentReader || index < 0 || index >= currentReader.pageCount) return;
    currentReader.getPage(index).catch(() => {});
}

// ---------------------------------------------------------------------------
// Página dupla
// ---------------------------------------------------------------------------
// Índice (0-based) da página da esquerda do par que contém idx, ou -1 se o
// par não existe (antes da 1ª ou depois da última página).
// modo 1 = par-ímpar (páginas 2-3, 4-5...) | modo 2 = ímpar-par (1-2, 3-4...)
function pairLeft(mode, idx) {
    const wantOddIndex = (mode === 1);
    const left = ((idx % 2 === 1) === wantOddIndex) ? idx : idx - 1;
    return (left >= 0 && left + 1 < currentReader.pageCount) ? left : -1;
}

// Junta duas páginas lado a lado numa única imagem (mesma altura)
async function buildSpreadBlob(index) {
    const [b1, b2] = await Promise.all([
        currentReader.getPage(index),
        currentReader.getPage(index + 1)
    ]);
    const urls = [URL.createObjectURL(b1), URL.createObjectURL(b2)];
    try {
        const imgs = await Promise.all(urls.map(u => new Promise((resolve, reject) => {
            const im = new Image();
            im.onload  = () => resolve(im);
            im.onerror = () => reject(new Error("Erro ao montar a página dupla"));
            im.src = u;
        })));
        const h  = Math.max(imgs[0].naturalHeight, imgs[1].naturalHeight);
        const w0 = Math.round(imgs[0].naturalWidth * h / imgs[0].naturalHeight);
        const w1 = Math.round(imgs[1].naturalWidth * h / imgs[1].naturalHeight);
        const canvas = document.createElement("canvas");
        canvas.width = w0 + w1;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(imgs[0], 0, 0, w0, h);
        ctx.drawImage(imgs[1], w0, 0, w1, h);
        return await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    } finally {
        urls.forEach(u => URL.revokeObjectURL(u));
    }
}

// Ciclo: simples → par-ímpar → ímpar-par → simples (pula estados impossíveis)
function cycleSpread() {
    if (!currentReader) return;
    if (viewMode === 0) spreadAnchor = currentIndex;
    let next = viewMode + 1;
    while (next <= 2 && pairLeft(next, spreadAnchor) === -1) next++;
    if (next > 2) {
        if (viewMode === 0) return;      // nenhum par possível (ex.: 1 página)
        currentIndex = currentIndex + 1; // sai na última página do par, em simples
        viewMode = 0;
    } else {
        viewMode = next;
        currentIndex = pairLeft(next, spreadAnchor);
    }
    renderPage();
}

// ---------------------------------------------------------------------------
// Zoom
// ---------------------------------------------------------------------------
function applyZoom() {
    img.style.height = (BASE_SIZE * zoomLevel) + "%";
    img.style.width  = 'auto';
}

function zoomIn()  { zoomLevel += ZOOM_STEP; applyZoom(); }
function zoomOut() { if (zoomLevel > 0.2) { zoomLevel -= ZOOM_STEP; applyZoom(); } }

function resetZoom() {
    zoomLevel = 1.0;
    img.style.height = BASE_SIZE + "%";
    img.style.width  = 'auto';
    container.scrollTop  = 0;
    container.scrollLeft = 0;
}

// ---------------------------------------------------------------------------
// Navegação (em dupla, sai para a simples seguinte/anterior ao par)
// ---------------------------------------------------------------------------
function nextPage() {
    if (!currentReader) return;
    const last = currentReader.pageCount - 1;
    if (viewMode !== 0) {
        viewMode = 0;
        currentIndex = Math.min(currentIndex + 2, last);
        renderPage();
    } else if (currentIndex < last) {
        currentIndex++;
        renderPage();
    }
}
function prevPage() {
    if (!currentReader) return;
    if (viewMode !== 0) {
        viewMode = 0;
        currentIndex = Math.max(currentIndex - 1, 0);
        renderPage();
    } else if (currentIndex > 0) {
        currentIndex--;
        renderPage();
    }
}

// Navegação direta por página
pageInfoEl.addEventListener("click", () => {
    if (!currentReader) return;
    gotoInput.max   = currentReader.pageCount;
    gotoInput.value = currentIndex + 1;
    document.getElementById("goto-label").textContent =
        `Ir para a página (1 – ${currentReader.pageCount}):`;
    gotoOverlay.classList.add("visible");
    gotoInput.focus();
    gotoInput.select();
});

function closeGoto() { gotoOverlay.classList.remove("visible"); }

function confirmGoto() {
    const val = parseInt(gotoInput.value);
    if (!isNaN(val) && val >= 1 && val <= currentReader.pageCount) {
        currentIndex = val - 1;
        viewMode = 0;
        renderPage();
    }
    closeGoto();
}

gotoInput.addEventListener("keydown", e => {
    if (e.key === "Enter")  confirmGoto();
    if (e.key === "Escape") closeGoto();
});

gotoOverlay.addEventListener("click", e => {
    if (e.target === gotoOverlay) closeGoto();
});

// ---------------------------------------------------------------------------
// Tela cheia
// ---------------------------------------------------------------------------
function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            showError(`Falha ao entrar em tela cheia: ${err.message}`);
        });
    } else {
        document.exitFullscreen().catch(err => {
            showError(`Falha ao sair de tela cheia: ${err.message}`);
        });
    }
}

// ---------------------------------------------------------------------------
// Fechar livro
// ---------------------------------------------------------------------------
function closeBook() {
    if (currentObjectURL) { URL.revokeObjectURL(currentObjectURL); currentObjectURL = null; }
    if (currentReader)    { currentReader.close(); currentReader = null; }
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

    currentIndex     = 0;
    viewMode         = 0;
    currentFileName  = "";
    currentFileHandle = null;
    currentCoverThumbnail = null;
    zoomLevel        = 1.0;
    updateTabTitle(null);

    container.style.display = "none";
    dropZone.style.display  = "flex";
    pageInfoEl.textContent  = "---";

    renderHistoryBar();
}

// ---------------------------------------------------------------------------
// Atalhos de teclado
// ---------------------------------------------------------------------------
document.addEventListener("keydown", e => {
    if (e.key === "g" || e.key === "G") {
        if (!currentReader) return;
        e.preventDefault();
        pageInfoEl.click();
        return;
    }

    if (!currentReader) return;

    switch (e.key) {
        case "f": case "F":
            e.preventDefault(); toggleFullScreen(); break;

        case "ArrowRight":
            e.preventDefault(); nextPage(); break;

        case "ArrowLeft":
            e.preventDefault(); prevPage(); break;

        case "ArrowDown":
            e.preventDefault();
            container.scrollBy({ top: 80, behavior: "smooth" }); break;

        case "ArrowUp":
            e.preventDefault();
            container.scrollBy({ top: -80, behavior: "smooth" }); break;

        case "+": case "=":
            e.preventDefault(); zoomIn(); break;

        case "-":
            e.preventDefault(); zoomOut(); break;

        case "d": case "D":
            e.preventDefault(); cycleSpread(); break;

        case "Escape":
            if (document.fullscreenElement) document.exitFullscreen();
            break;

        case "?":
            e.preventDefault(); showKeyboardHint(); break;
    }
});

// Popula a barra de histórico no carregamento inicial (some sozinha se vazia)
renderHistoryBar();
</script>
