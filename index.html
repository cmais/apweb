<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppWeb</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            margin: 0 0 40px;
            font-size: 32px;
        }
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .links a {
            display: block;
            padding: 15px 10px;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .links a:hover,
        .links a:focus-visible {
            color: #ffb570;
        }
    </style>
</head>

        <header>

        </header>
