<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #000000;
    color: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding-top: 6vh;
}

.container {
    width: 95%;
    max-width: 800px;
    text-align: center;
    background: #000000;
    padding: 8px 20px;
}

.controls-panel {
    display: inline-block;
    border: 1px solid #333333;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

label, button {
    background: #1f1f1f;
    border: 1px solid #2c2c2c;
    color: #e5e5e5;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.2s ease;
    display: flex;
    align-items: center;
    gap: 4px;
}

label:hover, button:hover {
    background: #2a2a2a;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* Botão histórico: tom levemente diferente quando o histórico está aberto */
#historyBtn.history-btn-active {
    background: #3a3a3a;
    border-color: #6a6a6a;
}

input[type="file"] {
    display: none;
}

video {
    width: 100%;
    max-height: 65vh;
    border-radius: 8px;
    background: black;
    display: none;
    transition: all 0.3s ease;
}

video.ready {
    box-shadow: 0 0 12px rgba(80, 80, 80, 0.35);
}

.cinema-mode video {
    filter:
        contrast(1.08)
        saturate(1.06)
        brightness(0.97);
    box-shadow: 0 0 15px rgba(100, 100, 100, 0.4);
}

/* Legendas */
.theme-white-1 video::cue {
    color: #ffffff;
    background-color: rgba(0, 0, 0, 0.8);
}

.theme-white-2 video::cue {
    color: #ffffff;
    background-color: transparent;
    text-shadow: 0 0 5px rgba(0,0,0,1);
}

.theme-yellow video::cue {
    color: #FFEA00;
    background-color: transparent;
    text-shadow: 0 0 5px rgba(0,0,0,1);
}

#status {
    font-size: 0.85rem;
    margin-top: 10px;
    color: #888;
    min-height: 20px;
    transition: opacity 0.4s ease;
}

#shortcut-feedback {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 1.2rem;
    font-weight: 500;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1000;
    opacity: 0;
}

.controls svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
}

/* ===== HISTÓRICO ===== */

.history {
    margin-top: 24px;
    text-align: left;
}

.history-heading {
    font-size: 0.8rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
}

.history-row {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 8px;
}

.history-card {
    flex: 0 0 110px;
    min-width: 0; /* evita que nomes longos (white-space: nowrap) estiquem o card */
    cursor: pointer;
}

.history-poster-wrap {
    position: relative;
    width: 110px;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: #4a4a4a; /* thumb default (cinza sólido) quando não há capa */
}

.history-poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.history-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease;
}

.history-remove:hover {
    background: rgba(0, 0, 0, 0.85);
}

.history-card:hover .history-remove {
    opacity: 1;
}

.history-name {
    width: 100%;
    margin-top: 6px;
    font-size: 0.75rem;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-progress-track {
    margin-top: 4px;
    height: 3px;
    border-radius: 2px;
    background: #333;
    overflow: hidden;
}

.history-progress-fill {
    height: 100%;
    background: #e5e5e5;
}
</style>
</head>

<body>

<div class="container theme-white-1" id="playerApp">

<div class="controls-panel">
<div class="controls">

            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/>

<video id="videoPlayer" controls crossorigin="anonymous"></video>

    Selecione um vídeo.

    <div class="history-heading">Continuar assistindo</div>

<script>
/* ELEMENTOS DOM */
const videoPlayer    = document.getElementById('videoPlayer');
const videoInput     = document.getElementById('videoInput');
const subtitleInput  = document.getElementById('subtitleInput');
const subtitleBtn    = document.getElementById('subtitleBtn');
const resetBtn       = document.getElementById('resetBtn');
const styleBtn       = document.getElementById('styleBtn');
const cinemaBtn      = document.getElementById('cinemaBtn');
const audioBtn       = document.getElementById('audioBtn');
const fullscreenBtn  = document.getElementById('fullscreenBtn');
const playerApp      = document.getElementById('playerApp');
const status         = document.getElementById('status');
const shortcutFeedback = document.getElementById('shortcut-feedback');
const loadVideoBtn   = document.getElementById('loadVideoBtn');
const historyBtn     = document.getElementById('historyBtn');
const historySection = document.getElementById('historySection');
const historyRow     = document.getElementById('historyRow');

/* VARIÁVEIS DE ESTADO */
let currentVideoKey       = null;
let currentVideoBlobUrl   = null;
let currentSubtitleBlobUrl = null;
let subtitleStyleIndex    = 0;
let cinemaMode            = false;
let audioCinemaMode       = false;
let lastSavedTime         = -1;

// MELHORIA 2: feedbackTimeout declarado como variável de estado, não como propriedade de DOM
let feedbackTimeout = null;

// Timeout para o auto-desaparecimento das mensagens de status
let statusHideTimeout = null;

/* ===== ÁUDIO CINEMA (WEB AUDIO API) =====
   Antes, o boost de grave (lowshelf) ficava acoplado ao Modo Cinema visual.
   Foi removido de lá para manter o Cinema só como ajuste de imagem (mais
   coerente com o projeto). Este grafo agora é independente, ligado pelo
   botão de Áudio: nivela dinâmica (sussurro vs. susto) e realça diálogo. */
let audioContext      = null;
let sourceNode        = null;
let compressorNode    = null;
let dialogueFilter    = null;
let audioGainNode     = null;
let isAudioInitialized = false;

function initAudioContext() {
    if (isAudioInitialized) return;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;

    audioContext = new AudioContext();
    sourceNode   = audioContext.createMediaElementSource(videoPlayer);

    // Nivela dinâmica: sobe o volume de trechos baixos (diálogo, sussurro) e
    // contém picos (sustos, ação), sem comprimir demais o restante.
    compressorNode = audioContext.createDynamicsCompressor();
    compressorNode.threshold.value = -24;
    compressorNode.knee.value      = 30;
    compressorNode.ratio.value     = 12;
    compressorNode.attack.value    = 0.003;
    compressorNode.release.value   = 0.25;

    // Realça a faixa de diálogo (voz), que costuma ficar "enterrada" quando
    // a trilha/efeitos sonoros competem com a fala.
    dialogueFilter = audioContext.createBiquadFilter();
    dialogueFilter.type = "peaking";
    dialogueFilter.frequency.value = 2500;
    dialogueFilter.Q.value = 1;
    dialogueFilter.gain.value = 5;

    // Compensa o volume percebido, que o compressor tende a reduzir um pouco.
    audioGainNode = audioContext.createGain();
    audioGainNode.gain.value = Math.min(1.0 / videoPlayer.volume, 1.1);

    isAudioInitialized = true;
    updateAudioRouting();
}

function updateAudioRouting() {
    if (!isAudioInitialized) return;

    if (audioContext.state === 'suspended') {
        audioContext.resume();
    }

    try { sourceNode.disconnect();     } catch(e) {}
    try { compressorNode.disconnect(); } catch(e) {}
    try { dialogueFilter.disconnect(); } catch(e) {}
    try { audioGainNode.disconnect();  } catch(e) {}

    if (audioCinemaMode) {
        // Áudio Cinema: Vídeo → Compressor → Realce de diálogo → Gain → Destino
        sourceNode.connect(compressorNode);
        compressorNode.connect(dialogueFilter);
        dialogueFilter.connect(audioGainNode);
        audioGainNode.connect(audioContext.destination);
    } else {
        // Normal: Vídeo → Destino
        sourceNode.connect(audioContext.destination);
    }
}

/* ===== STATUS & UI ===== */

// MELHORIA: mensagens de status somem sozinhas depois de 10s, exceto quando
// marcadas como "persistent" (ex: pedido de ação do usuário, como reselecionar
// um arquivo) — essas ficam até a próxima mensagem substituí-las.
function updateStatus(message, ready = false, persistent = false) {
    status.textContent = message;
    status.style.color = ready ? "#9aa09a" : "#888";
    status.style.opacity = "1";

    clearTimeout(statusHideTimeout);
    if (!persistent) {
        statusHideTimeout = setTimeout(() => {
            status.style.opacity = "0";
        }, 10000);
    }
}

function applySubtitleStyle() {
    playerApp.classList.remove("theme-white-1", "theme-white-2", "theme-yellow");
    const labels  = ["Branco 01", "Branco 02", "Amarelo"];
    const classes = ["theme-white-1", "theme-white-2", "theme-yellow"];

    playerApp.classList.add(classes[subtitleStyleIndex]);
    styleBtn.title = `Estilo: ${labels[subtitleStyleIndex]} (L)`;
}

function applyCinemaMode() {
    playerApp.classList.toggle("cinema-mode", cinemaMode);
    cinemaBtn.title = cinemaMode ? "Modo Cinema: On (C)" : "Modo Cinema: Off (C)";
}

function applyAudioCinemaMode() {
    audioBtn.title = audioCinemaMode ? "Áudio Cinema: On (A)" : "Áudio Cinema: Off (A)";
    updateAudioRouting();
}

/* ===== FEEDBACK VISUAL PARA ATALHOS ===== */
function showShortcutFeedback(text) {
    shortcutFeedback.textContent = text;
    shortcutFeedback.style.opacity = "1";

    // MELHORIA 2: usa variável de estado dedicada, sem poluir o objeto DOM
    clearTimeout(feedbackTimeout);
    feedbackTimeout = setTimeout(() => {
        shortcutFeedback.style.opacity = "0";
    }, 800);
}

/* ===== PERSISTÊNCIA ===== */

// MELHORIA 9: limite de entradas no localStorage para evitar acúmulo indefinido
const STORAGE_PREFIX = "videoProgress_";
const STORAGE_MAX_ENTRIES = 20;

function pruneOldProgressEntries() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(STORAGE_PREFIX)) {
            keys.push(k);
        }
    }
    // Remove as entradas mais antigas quando passa do limite
    if (keys.length > STORAGE_MAX_ENTRIES) {
        keys.slice(0, keys.length - STORAGE_MAX_ENTRIES)
            .forEach(k => localStorage.removeItem(k));
    }
}

function saveProgress() {
    if (!currentVideoKey) return;
    if (isNaN(videoPlayer.duration)) return;

    localStorage.setItem(
        STORAGE_PREFIX + currentVideoKey,
        JSON.stringify({
            time:   videoPlayer.currentTime,
            style:  subtitleStyleIndex,
            cinema: cinemaMode,
            audioCinema: audioCinemaMode
        })
    );

    pruneOldProgressEntries();
    updateHistoryProgress(videoPlayer.currentTime, videoPlayer.duration);
}

function restoreProgress() {
    if (!currentVideoKey) return;

    const saved = localStorage.getItem(STORAGE_PREFIX + currentVideoKey);

    let savedTime   = 0;
    let savedStyle  = 0;
    let savedCinema = false;
    let savedAudioCinema = false;

    if (saved) {
        try {
            const data  = JSON.parse(saved);
            savedTime   = data.time   || 0;
            savedStyle  = data.style  ?? 0;
            savedCinema = data.cinema ?? false;
            savedAudioCinema = data.audioCinema ?? false;
        } catch {
            localStorage.removeItem(STORAGE_PREFIX + currentVideoKey);
        }
    }

    subtitleStyleIndex = savedStyle;
    cinemaMode         = savedCinema;
    audioCinemaMode    = savedAudioCinema;

    applySubtitleStyle();
    applyCinemaMode();
    applyAudioCinemaMode();

    if (savedTime > 0 && savedTime < videoPlayer.duration) {
        videoPlayer.currentTime = savedTime;
    }
}

/* ===== HISTÓRICO (IndexedDB + OMDb) ===== */

// Chave da OMDb (http://www.omdbapi.com/). Free tier: 1000 requisições/dia,
// mais que suficiente para uso pessoal.
const OMDB_API_KEY = 'c26a374c';

const DB_NAME    = 'player4DB';
const DB_VERSION = 2;
let dbPromise = null;

function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('history')) {
                db.createObjectStore('history', { keyPath: 'key' });
            }
            if (!db.objectStoreNames.contains('posters')) {
                db.createObjectStore('posters', { keyPath: 'titleYear' });
            }
            if (!db.objectStoreNames.contains('subtitles')) {
                db.createObjectStore('subtitles', { keyPath: 'key' });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
    });
    return dbPromise;
}

async function idbGet(storeName, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const req = db.transaction(storeName, 'readonly').objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror   = () => reject(req.error);
    });
}

async function idbGetAll(storeName) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror   = () => reject(req.error);
    });
}

async function idbPut(storeName, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value);
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
    });
}

async function idbDelete(storeName, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
    });
}

// Extrai título e ano a partir de "Nome (Ano).ext". Sem esse padrão, usa o nome
// inteiro (sem extensão) como título e não manda ano na busca.
function parseTitleYear(fileName) {
    const nameNoExt = fileName.replace(/\.[^/.]+$/, '');
    const match = nameNoExt.match(/^(.*?)\s*\((\d{4})\)\s*$/);
    if (match) {
        return { title: match[1].trim(), year: match[2] };
    }
    return { title: nameNoExt.trim(), year: null };
}

// Busca a capa na OMDb, com cache em IndexedDB por "titulo|ano" (independe do
// arquivo específico, então filmes repetidos não geram nova requisição).
async function fetchPosterUrl(title, year) {
    if (!OMDB_API_KEY || !title) return null;

    const cacheKey = title.toLowerCase() + '|' + (year || '');
    const cached = await idbGet('posters', cacheKey);
    if (cached) return cached.posterUrl; // pode ser null: já buscado, sem resultado

    let url = `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}`
             + `&t=${encodeURIComponent(title)}&type=movie`;
    if (year) url += `&y=${year}`;

    let posterUrl = null;
    try {
        const res  = await fetch(url);
        const data = await res.json();
        if (data.Response === 'True' && data.Poster && data.Poster !== 'N/A') {
            posterUrl = data.Poster;
        }
    } catch (e) {
        // offline ou erro de rede: fica null, thumb cai no cinza default
    }

    await idbPut('posters', { titleYear: cacheKey, posterUrl });
    return posterUrl;
}

// Cria/atualiza a entrada do histórico e dispara a busca da capa em segundo plano.
async function upsertHistoryEntry(file, handle) {
    const key = currentVideoKey;
    const { title, year } = parseTitleYear(file.name);
    const existing = (await idbGet('history', key)) || {};

    const entry = {
        key,
        fileName:      file.name,
        title,
        year,
        time:          existing.time || 0,
        duration:      existing.duration || null,
        posterUrl:     existing.posterUrl || null,
        posterChecked: existing.posterChecked || false,
        handle:        handle || existing.handle || null,
        lastPlayed:    Date.now()
    };

    await idbPut('history', entry);
    renderHistory();

    if (!entry.posterChecked) {
        const posterUrl = await fetchPosterUrl(title, year);
        const latest = await idbGet('history', key);
        if (latest) {
            latest.posterUrl     = posterUrl;
            latest.posterChecked = true;
            await idbPut('history', latest);
            renderHistory();
        }
    }
}

async function updateHistoryProgress(time, duration) {
    if (!currentVideoKey) return;
    const entry = await idbGet('history', currentVideoKey);
    if (!entry) return;

    entry.time = time;
    if (duration && !isNaN(duration)) entry.duration = duration;

    await idbPut('history', entry);
    renderHistory();
}

async function removeHistoryEntry(key) {
    await idbDelete('history', key);
    await idbDelete('subtitles', key); // legenda associada não faz mais sentido sem a entrada
    renderHistory();
}

// Controla a exibição da fileira de histórico. Diferente da versão anterior,
// a visibilidade agora é um estado manual (historyOpen), não é mais deduzida
// do estado de pause/play/ended do vídeo a cada renderização — isso evitava
// que o histórico reaparecesse sozinho (ex: durante o auto-save de progresso
// no pause). Os únicos gatilhos que mudam historyOpen são: clique no botão
// histórico, clique no botão "X" (reset), o vídeo chegar ao fim (ended), dar
// play (sempre fecha) e o estado inicial da página (sem vídeo = aberto).
let historyHasEntries = false;
let historyOpen       = true; // estado inicial: sem vídeo carregado, histórico visível

function setHistoryVisible(visible) {
    historyOpen = visible;
    historySection.style.display = (historyOpen && historyHasEntries) ? 'block' : 'none';
    updateHistoryBtnState();
}

// Botão histórico: desabilitado (com o mesmo tom de "disabled" já usado nos
// outros botões) quando não há nada no histórico; fica com um tom levemente
// diferente quando o histórico está aberto.
function updateHistoryBtnState() {
    historyBtn.disabled = !historyHasEntries;
    historyBtn.classList.toggle('history-btn-active', historyOpen && historyHasEntries);
}

// Tenta reabrir o vídeo direto pelo handle (Chrome/Edge). Sem handle ou sem
// permissão (ex: Firefox, que não suporta showOpenFilePicker), pede pra
// selecionar o arquivo de novo.
async function attemptReopenFromHistory(entry) {
    if (entry.handle) {
        try {
            let perm = await entry.handle.queryPermission({ mode: 'read' });
            if (perm !== 'granted') {
                perm = await entry.handle.requestPermission({ mode: 'read' });
            }
            if (perm === 'granted') {
                const file = await entry.handle.getFile();
                loadVideo(file, entry.handle);
                return;
            }
            // Chrome não persiste a permissão do handle entre recarregamentos de
            // página para sites comuns; "prompt"/"denied" aqui é esperado às vezes.
            console.warn('Permissão de leitura não concedida para', entry.fileName, '- status:', perm);
        } catch (e) {
            console.warn('Falha ao reabrir via handle salvo para', entry.fileName, e);
        }
    }

    updateStatus(`Selecione o arquivo "${entry.fileName}" novamente para continuar.`, false, true);
    if (window.showOpenFilePicker) {
        loadVideoBtn.click();
    } else {
        videoInput.click();
    }
}

async function renderHistory() {
    const entries = await idbGetAll('history');
    entries.sort((a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0));

    historyHasEntries = entries.length > 0;

    if (entries.length === 0) {
        historyRow.innerHTML = '';
        setHistoryVisible(historyOpen); // reaplica (fica oculto pois historyHasEntries é false) e atualiza o botão
        return;
    }

    historyRow.innerHTML = '';

    entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'history-card';

        const posterWrap = document.createElement('div');
        posterWrap.className = 'history-poster-wrap';

        if (entry.posterUrl) {
            const img = document.createElement('img');
            img.src = entry.posterUrl;
            img.alt = entry.title || entry.fileName;
            posterWrap.appendChild(img);
        }
        // sem posterUrl: mantém o fundo cinza sólido (thumb default) do CSS

        const removeBtn = document.createElement('div');
        removeBtn.className = 'history-remove';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remover do histórico';
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeHistoryEntry(entry.key);
        });
        posterWrap.appendChild(removeBtn);

        const name = document.createElement('div');
        name.className = 'history-name';
        name.textContent = entry.title || entry.fileName;
        name.title = entry.title || entry.fileName;

        const progressTrack = document.createElement('div');
        progressTrack.className = 'history-progress-track';
        const progressFill = document.createElement('div');
        progressFill.className = 'history-progress-fill';
        const pct = entry.duration ? Math.min(100, (entry.time / entry.duration) * 100) : 0;
        progressFill.style.width = pct + '%';
        progressTrack.appendChild(progressFill);

        card.appendChild(posterWrap);
        card.appendChild(name);
        card.appendChild(progressTrack);

        card.addEventListener('click', () => attemptReopenFromHistory(entry));

        historyRow.appendChild(card);
    });

    setHistoryVisible(historyOpen); // reaplica o estado atual (não força reabertura)
}

/* ===== VÍDEO ===== */

function loadVideo(file, handle = null) {
    cleanupVideo(false);

    subtitleInput.value = "";
    lastSavedTime       = -1;

    const videoURL = URL.createObjectURL(file);
    videoPlayer.src = videoURL;
    videoPlayer.style.display = "block";

    currentVideoBlobUrl = videoURL;
    currentVideoKey     = file.name + "-" + file.size + "-" + file.lastModified;

    upsertHistoryEntry(file, handle);
    loadPersistedSubtitle(currentVideoKey);

    cinemaBtn.disabled    = false;
    audioBtn.disabled     = false;
    fullscreenBtn.disabled = false;
    styleBtn.disabled     = true;

    initAudioContext();

    videoPlayer.addEventListener("loadedmetadata", () => {
        restoreProgress();
        applySubtitleStyle();
        updateHistoryProgress(videoPlayer.currentTime, videoPlayer.duration);
    }, { once: true });

    updateStatus("Vídeo carregado. Adicione legenda (opcional).");
}

/* ===== LEGENDA ===== */

// MELHORIA 5: remove tags HTML comuns em arquivos SRT brasileiros antes da conversão
function stripSrtHtmlTags(text) {
    return text
        .replace(/<font[^>]*>/gi, '')
        .replace(/<\/font>/gi, '')
        .replace(/<b>/gi, '')
        .replace(/<\/b>/gi, '')
        .replace(/<i>/gi, '')
        .replace(/<\/i>/gi, '')
        .replace(/<u>/gi, '')
        .replace(/<\/u>/gi, '');
}

// Cria a <track> a partir de um texto VTT já pronto e anexa ao player.
// Compartilhada entre "carreguei um .srt agora" e "recuperei do histórico".
function attachSubtitleTrack(vttText) {
    if (currentSubtitleBlobUrl) URL.revokeObjectURL(currentSubtitleBlobUrl);

    const blob = new Blob([vttText], { type: 'text/vtt' });
    const url  = URL.createObjectURL(blob);

    currentSubtitleBlobUrl = url;

    removeSubtitleTracks();

    const track   = document.createElement('track');
    track.kind    = "subtitles";
    track.label   = "Legenda";
    track.srclang = "pt";
    track.src     = url;
    track.default = true;

    track.onload = function() {
        this.mode = "showing";
        if (videoPlayer.textTracks[0]) videoPlayer.textTracks[0].mode = "showing";
    };

    videoPlayer.appendChild(track);

    if (videoPlayer.textTracks.length > 0) {
        videoPlayer.textTracks[0].mode = "showing";
    }

    videoPlayer.classList.add("ready");
    styleBtn.disabled = false;
}

// Remove as <track> atuais. Desativa o modo antes de remover para forçar o
// navegador a apagar imediatamente o texto da legenda que estava na tela
// (removê-la do DOM sozinho às vezes deixa o último texto "pendurado").
function removeSubtitleTracks() {
    Array.from(videoPlayer.textTracks).forEach(t => t.mode = "disabled");
    Array.from(videoPlayer.getElementsByTagName('track')).forEach(t => t.remove());
}

function loadSubtitle(file) {
    if (!currentVideoKey) {
        updateStatus("Carregue um vídeo antes da legenda.");
        subtitleInput.value = "";
        return;
    }

    const videoKeyAtLoadTime = currentVideoKey;
    const reader = new FileReader();

    reader.onload = function(e) {
        let text;
        try {
            text = new TextDecoder("utf-8", { fatal: true }).decode(e.target.result);
        } catch {
            try {
                text = new TextDecoder("windows-1252").decode(e.target.result);
            } catch {
                text = new TextDecoder("iso-8859-1").decode(e.target.result);
            }
        }

        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        // MELHORIA 5: limpa tags HTML antes de converter para VTT
        text = stripSrtHtmlTags(text);

        const vtt = "WEBVTT\n\n" +
            text.replace(/(\d{2}:\d{2}:\d{2})[.,](\d{3})/g, '$1.$2');

        attachSubtitleTrack(vtt);
        updateStatus("Legenda carregada.", true);

        // Persiste o conteúdo já processado, associado ao vídeo atual, para
        // recarregar sozinha da próxima vez (mesmo em uma sessão nova).
        idbPut('subtitles', { key: videoKeyAtLoadTime, vtt, fileName: file.name })
            .catch(err => console.error('Falha ao salvar legenda no IndexedDB:', err));
    };

    reader.readAsArrayBuffer(file);
}

// Ao carregar um vídeo, verifica se já existe legenda salva para ele e,
// se sim, anexa automaticamente sem precisar selecionar o arquivo de novo.
async function loadPersistedSubtitle(key) {
    const saved = await idbGet('subtitles', key);
    if (!saved || key !== currentVideoKey) return; // vídeo pode ter trocado nesse meio-tempo

    attachSubtitleTrack(saved.vtt);
    updateStatus("Legenda carregada automaticamente.", true);
}

/* ===== LIMPEZA ===== */

function cleanupVideo(fullReset = true) {
    videoPlayer.pause();

    if (isAudioInitialized) {
        cinemaMode      = false;
        audioCinemaMode = false;
        updateAudioRouting();

        // Não fechamos o AudioContext aqui: um HTMLMediaElement só pode ser
        // conectado a um MediaElementSourceNode UMA vez na vida (o navegador
        // recusa criar um segundo, mesmo com um novo AudioContext). Como o
        // player reaproveita sempre a mesma tag <video>, fechar e recriar o
        // contexto no reset causava "InvalidStateError" ao carregar o próximo
        // vídeo. Mantemos o contexto vivo e só resetamos o roteamento acima.
    }

    if (currentVideoBlobUrl)   URL.revokeObjectURL(currentVideoBlobUrl);
    if (currentSubtitleBlobUrl) URL.revokeObjectURL(currentSubtitleBlobUrl);

    currentVideoBlobUrl    = null;
    currentSubtitleBlobUrl = null;

    // Remove/desativa a legenda ANTES de resetar o <video>, para não deixar
    // o texto da legenda anterior "pendurado" na tela durante a troca.
    removeSubtitleTracks();

    currentVideoKey = null;

    videoPlayer.removeAttribute("src");
    videoPlayer.load();
    videoPlayer.style.display = "none";
    videoPlayer.classList.remove("ready");

    if (fullReset) {
        videoInput.value    = "";
        subtitleInput.value = "";
        styleBtn.disabled      = true;
        cinemaBtn.disabled     = true;
        audioBtn.disabled      = true;
        fullscreenBtn.disabled = true;

        subtitleStyleIndex = 0;
        cinemaMode         = false;
        audioCinemaMode    = false;
        lastSavedTime      = -1;
        applySubtitleStyle();
        applyCinemaMode();
        applyAudioCinemaMode();

        setHistoryVisible(true);
        updateStatus("Arquivos removidos.");
    }
}

/* ===== EVENTOS ===== */

// Um "id" fixo no picker faz o navegador lembrar a última pasta usada para
// esse id específico (persiste entre recarregamentos de página). Vídeo e
// legenda compartilham o mesmo id de propósito: legendas costumam estar na
// mesma pasta do filme, então abrir a legenda já cai direto lá.
const FOLDER_PICKER_ID = 'mvp-media-folder';

loadVideoBtn.addEventListener('click', async () => {
    if (window.showOpenFilePicker) {
        try {
            const [handle] = await window.showOpenFilePicker({
                id: FOLDER_PICKER_ID,
                types: [{
                    description: 'Vídeos',
                    accept: { 'video/*': ['.mp4', '.mkv', '.avi', '.webm', '.mov', '.m4v'] }
                }]
            });
            const file = await handle.getFile();
            loadVideo(file, handle);
        } catch (e) {
            // usuário cancelou o seletor de arquivo
        }
    } else {
        // Firefox e navegadores sem File System Access API: seletor tradicional
        videoInput.click();
    }
});

videoInput.addEventListener('change', e => {
    if (e.target.files[0]) loadVideo(e.target.files[0]);
});

subtitleBtn.addEventListener('click', async () => {
    if (!currentVideoKey) {
        updateStatus("Carregue um vídeo antes da legenda.");
        return;
    }

    if (window.showOpenFilePicker) {
        try {
            const [handle] = await window.showOpenFilePicker({
                id: FOLDER_PICKER_ID,
                types: [{
                    description: 'Legendas',
                    accept: { 'text/plain': ['.srt'] }
                }]
            });
            const file = await handle.getFile();
            loadSubtitle(file);
        } catch (e) {
            // usuário cancelou o seletor de arquivo
        }
    } else {
        // Firefox e navegadores sem File System Access API: seletor tradicional
        subtitleInput.click();
    }
});

subtitleInput.addEventListener('change', e => {
    if (e.target.files[0]) loadSubtitle(e.target.files[0]);
});

styleBtn.addEventListener('click', () => {
    subtitleStyleIndex = (subtitleStyleIndex + 1) % 3;
    applySubtitleStyle();
    saveProgress();
    showShortcutFeedback("Estilo: " + ["Branco 01", "Branco 02", "Amarelo"][subtitleStyleIndex]);
});

cinemaBtn.addEventListener('click', () => {
    cinemaMode = !cinemaMode;
    applyCinemaMode();
    saveProgress();
    showShortcutFeedback(cinemaMode ? "Cinema: On" : "Cinema: Off");
});

audioBtn.addEventListener('click', () => {
    audioCinemaMode = !audioCinemaMode;
    applyAudioCinemaMode();
    saveProgress();
    showShortcutFeedback(audioCinemaMode ? "Áudio Cinema: On" : "Áudio Cinema: Off");
});

fullscreenBtn.addEventListener('click', () => {
    if (!currentVideoKey) return;
    if (!document.fullscreenElement) {
        videoPlayer.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
});

// MELHORIA 3: feedback de tela cheia via evento fullscreenchange (estado correto, sem race condition)
document.addEventListener('fullscreenchange', () => {
    showShortcutFeedback(document.fullscreenElement ? "Tela Cheia" : "Janela");
});

resetBtn.addEventListener('click', () => {
    cleanupVideo(true);
    showShortcutFeedback("Limpo");
});

videoPlayer.addEventListener("pause", saveProgress);
// O pause (via controles nativos, atalho, etc.) só habilita o botão histórico
// (feito em saveProgress -> updateHistoryProgress -> renderHistory), mas não
// exibe o histórico sozinho — só o clique no botão histórico faz isso.
videoPlayer.addEventListener("play",  () => setHistoryVisible(false));

historyBtn.addEventListener('click', () => {
    if (!historyHasEntries) return;

    const isPlaying = currentVideoKey && !videoPlayer.paused && !videoPlayer.ended;
    if (isPlaying) {
        // Clique durante a reprodução: pausa o vídeo e abre o histórico juntos
        videoPlayer.pause();
        setHistoryVisible(true);
    } else {
        // Pausado (ou sem vídeo): alterna entre mostrar/ocultar
        setHistoryVisible(!historyOpen);
    }
});

videoPlayer.addEventListener("timeupdate", () => {
    const currentSecond = Math.floor(videoPlayer.currentTime);
    if (currentSecond > 0 && currentSecond % 5 === 0 && currentSecond !== lastSavedTime) {
        saveProgress();
        lastSavedTime = currentSecond;
    }
});

window.addEventListener("beforeunload", saveProgress);

videoPlayer.addEventListener("ended", () => {
    if (currentVideoKey) {
        localStorage.removeItem(STORAGE_PREFIX + currentVideoKey);
        updateHistoryProgress(videoPlayer.duration, videoPlayer.duration);
    }
    setHistoryVisible(true);
});

renderHistory();

/* ===== ATALHOS DE TECLADO ===== */
document.addEventListener("keydown", (event) => {
    const tag = document.activeElement.tagName.toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    const key = event.key.toLowerCase();

    // MELHORIA 4: usa currentVideoKey como verificação de estado (mais confiável que videoPlayer.src)

    // ESPAÇO: play/pause
    if (key === ' ') {
        if (!currentVideoKey) return;
        event.preventDefault();
        if (videoPlayer.paused) {
            videoPlayer.play();
            showShortcutFeedback("Play");
        } else {
            videoPlayer.pause();
            showShortcutFeedback("Pause");
        }
    }

    // SETA ESQUERDA: -10s
    if (key === 'arrowleft') {
        if (!currentVideoKey) return;
        event.preventDefault();
        videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
        showShortcutFeedback("-10s");
    }

    // SETA DIREITA: +10s
    if (key === 'arrowright') {
        if (!currentVideoKey || isNaN(videoPlayer.duration)) return;
        event.preventDefault();
        videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 10);
        showShortcutFeedback("+10s");
    }

    if (key === "l" && !styleBtn.disabled) {
        styleBtn.click();
        event.preventDefault();
    }

    if (key === "c" && !cinemaBtn.disabled) {
        cinemaBtn.click();
        event.preventDefault();
    }

    if (key === "a" && !audioBtn.disabled) {
        audioBtn.click();
        event.preventDefault();
    }

    if (key === "f") {
        if (!currentVideoKey) return;
        event.preventDefault();
        fullscreenBtn.click();
    }
});
</script>
